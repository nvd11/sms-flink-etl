name: Trigger NUC Batch Runner

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Lakehouse Schema Environment (finance for Prod, finance_dev for Dev)'
        required: false
        default: 'finance'
        type: choice
        options:
          - finance
          - finance_dev
      image:
        description: 'Override Docker image (leave empty for default baseline image)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dispatch-batch-job:
    name: Dispatch Ephemeral Batch Job to NUC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH Key & Execute Batch Job on K3s
        env:
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
          SSH_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          TARGET_ENV: ${{ inputs.target_env || 'finance' }}
          OVERRIDE_IMAGE: ${{ inputs.image }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # 1. 建立临时 SSH 密钥环境与 ControlMaster 长连接复用通道
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat << 'EOF' >> ~/.ssh/config
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ConnectionAttempts 3
          EOF

          run_ssh() {
            ssh "${SSH_USER}@${SSH_HOST}" "$@"
          }

          JOB_NAME="nuc-run-${RUN_ID}"
          echo "🚀 Preparing dispatch for Job: ${JOB_NAME} (Target Schema: ${TARGET_ENV})"

          # 2. 动态组装并执行拉起命令 (精准覆盖 ICEBERG_CATALOG_SCHEMA 与镜像)
          run_ssh "sudo kubectl create job --from=cronjob/nuc-batch-runner ${JOB_NAME} -n batch-jobs --dry-run=client -o json" \
            | jq --arg schema "${TARGET_ENV}" --arg img "${OVERRIDE_IMAGE}" '
                .spec.template.spec.containers[0].env = ((.spec.template.spec.containers[0].env // []) | map(select(.name != "ICEBERG_CATALOG_SCHEMA")) + [{"name": "ICEBERG_CATALOG_SCHEMA", "value": $schema}]) |
                if ($img != "") then .spec.template.spec.containers[0].image = $img else . end
              ' \
            | run_ssh "sudo kubectl apply -f -"
          echo "✅ Job dispatched to K3s successfully!"

          # 4. 轮询等待 Job 执行完成并打印日志 (最多 180 秒)
          echo "⏳ Waiting for batch execution to complete on NUC..."
          if ! run_ssh "sudo kubectl wait --for=condition=complete --timeout=180s job/${JOB_NAME} -n batch-jobs"; then
            echo "❌ Job did not complete in time. Inspecting pod status and logs:"
            run_ssh "sudo kubectl describe pods -n batch-jobs -l job-name=${JOB_NAME} || true"
            run_ssh "sudo kubectl logs -n batch-jobs -l job-name=${JOB_NAME} --tail=100 || true"
            exit 1
          fi

          # 5. 获取 Pod 输出日志并记录到 Summary
          LOGS=$(run_ssh "sudo kubectl logs -n batch-jobs -l job-name=${JOB_NAME} --tail=100")
          
          echo "### 📊 Batch Execution Logs on NUC Nova" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$LOGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "$LOGS"

          echo "🎉 Batch job completed! Pod lifecycle and cleanup natively managed by Kubernetes ttlSecondsAfterFinished."
