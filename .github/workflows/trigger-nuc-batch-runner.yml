name: Trigger NUC Batch Runner

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Lakehouse Schema Environment (finance for Prod, finance_dev for Dev)'
        required: false
        default: 'finance'
        type: choice
        options:
          - finance
          - finance_dev
      pipeline_stage:
        description: 'Pipeline Stage to Execute (ods, dwd, report, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ods
          - dwd
          - report
      report_period:
        description: 'Report Period for report stage (DAILY, WEEKLY, MONTHLY)'
        required: false
        default: 'DAILY'
        type: choice
        options:
          - DAILY
          - WEEKLY
          - MONTHLY
      report_value:
        description: 'Optional period value for report stage (e.g. 2026-10-08, 2026-W41, 2026-10; leave empty for auto-discovery)'
        required: false
        default: ''
      image:
        description: 'Override Docker image (leave empty for default baseline image)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dispatch-batch-job:
    name: Dispatch Ephemeral Batch Job to NUC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH Key & Execute Batch Job on K3s
        env:
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
          SSH_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          TARGET_ENV: ${{ inputs.target_env || 'finance' }}
          PIPELINE_STAGE: ${{ inputs.pipeline_stage || 'all' }}
          REPORT_PERIOD: ${{ inputs.report_period || 'DAILY' }}
          REPORT_VALUE: ${{ inputs.report_value || '' }}
          OVERRIDE_IMAGE: ${{ inputs.image }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # 1. 建立临时 SSH 密钥环境与 ControlMaster 长连接复用通道
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat << 'EOF' >> ~/.ssh/config
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ConnectionAttempts 3
          EOF

          run_ssh() {
            ssh "${SSH_USER}@${SSH_HOST}" "$@"
          }

          execute_stage() {
            local stage_name="$1"
            local job_name="nuc-${stage_name}-${RUN_ID}"
            echo "================================================================================"
            echo "🚀 [Stage: ${stage_name^^}] Preparing dispatch for Job: ${job_name} (Target Schema: ${TARGET_ENV})"
            echo "================================================================================"

            # 动态组装并执行拉起命令 (精准注入 ICEBERG_CATALOG_SCHEMA, FLINK_JOB_NAME, REPORT_PERIOD, REPORT_VALUE 与镜像，并放宽 activeDeadlineSeconds 为 600s)
            run_ssh "sudo kubectl create job --from=cronjob/nuc-batch-runner ${job_name} -n batch-jobs --dry-run=client -o json" \
              | jq --arg schema "${TARGET_ENV}" --arg stage "${stage_name}" --arg rperiod "${REPORT_PERIOD}" --arg rval "${REPORT_VALUE}" --arg img "${OVERRIDE_IMAGE}" '
                  .spec.activeDeadlineSeconds = 600 |
                  .spec.template.spec.activeDeadlineSeconds = 600 |
                  .spec.template.spec.containers[0].env = ((.spec.template.spec.containers[0].env // []) 
                    | map(select(.name != "ICEBERG_CATALOG_SCHEMA" and .name != "FLINK_JOB_NAME" and .name != "REPORT_PERIOD" and .name != "REPORT_VALUE")) 
                    + [
                        {"name": "ICEBERG_CATALOG_SCHEMA", "value": $schema},
                        {"name": "FLINK_JOB_NAME", "value": $stage},
                        {"name": "REPORT_PERIOD", "value": $rperiod}
                      ]
                    + (if $rval != "" then [{"name": "REPORT_VALUE", "value": $rval}] else [] end)
                  ) |
                  if ($img != "") then .spec.template.spec.containers[0].image = $img else . end
                ' \
              | run_ssh "sudo kubectl apply -f -"
            echo "✅ Job ${job_name} dispatched to K3s successfully!"

            # 轮询等待 Job 执行完成并打印日志 (最多 600 秒 / 10 分钟)
            echo "⏳ Waiting for ${stage_name^^} execution to complete on NUC..."
            if ! run_ssh "sudo kubectl wait --for=condition=complete --timeout=600s job/${job_name} -n batch-jobs"; then
              echo "❌ Job ${job_name} did not complete in time. Inspecting pod status and logs:"
              run_ssh "sudo kubectl describe pods -n batch-jobs -l job-name=${job_name} || true"
              run_ssh "sudo kubectl logs -n batch-jobs -l job-name=${job_name} --tail=100 || true"
              exit 1
            fi

            # 获取 Pod 输出日志并记录到 Summary
            local logs
            logs=$(run_ssh "sudo kubectl logs -n batch-jobs -l job-name=${job_name} --tail=100")
            
            echo "### 📊 [Stage: ${stage_name^^}] Batch Execution Logs on NUC Nova" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            echo "$logs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo "✅ [Stage: ${stage_name^^}] Completed successfully!"
          }

          if [ "${PIPELINE_STAGE}" = "all" ] || [ "${PIPELINE_STAGE}" = "ods" ]; then
            execute_stage "ods"
          fi

          if [ "${PIPELINE_STAGE}" = "all" ] || [ "${PIPELINE_STAGE}" = "dwd" ]; then
            execute_stage "dwd"
          fi

          if [ "${PIPELINE_STAGE}" = "report" ]; then
            execute_stage "report"
          fi

          echo "================================================================================"
          echo "🎉 All requested batch stages executed successfully on NUC!"
          echo "================================================================================"
