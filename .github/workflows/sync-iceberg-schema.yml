name: Sync Iceberg Lakehouse Schema

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/schema.sql'
      - 'scripts/schema-dev.sql'
      - 'scripts/schema-dwd.sql'
      - 'scripts/schema-dws.sql'
      - 'scripts/schema-dws-dev.sql'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Lakehouse Environment to sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - prod

jobs:
  sync-schema:
    name: Sync Schema (${{ github.event.inputs.target_env || 'all' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Trino Schema DDL
        env:
          TRINO_URL: ${{ secrets.TRINO_URL || 'https://trino.jppwl.asia' }}
          TRINO_USER: ${{ secrets.TRINO_USER || 'github-actions-sync' }}
          TARGET_ENV: ${{ github.event.inputs.target_env || 'all' }}
        run: |
          echo "================================================================="
          echo "🚀 Executing Iceberg Schema Sync on Trino: $TRINO_URL"
          echo "🎯 Target Environment: $TARGET_ENV"
          echo "================================================================="

          if [ "$TARGET_ENV" = "dev" ] || [ "$TARGET_ENV" = "all" ]; then
            echo "📦 Syncing DEV environment (iceberg.finance_dev)..."
            ./scripts/trino.sh -f scripts/schema-dev.sql
            ./scripts/trino.sh -f scripts/schema-dws-dev.sql
          fi

          if [ "$TARGET_ENV" = "prod" ] || [ "$TARGET_ENV" = "all" ]; then
            echo "🌊 Syncing PROD environment (iceberg.finance)..."
            ./scripts/trino.sh -f scripts/schema.sql
            ./scripts/trino.sh -f scripts/schema-dws.sql
          fi

          echo "================================================================="
          echo "✅ Iceberg Schema Sync Completed Successfully!"
          echo "================================================================="
