name: Build and Push SMS Gmail R2 Job Image

on:
  push:
    branches: [ main ]
    paths:
      - "src/main/java/com/finance/etl/jobs/SmsGmailR2Job.java"
      - "src/main/java/com/finance/etl/pipeline/**"
      - "src/main/java/com/finance/etl/reader/**"
      - "src/main/java/com/finance/etl/transform/**"
      - "src/main/java/com/finance/etl/model/**"
      - "src/main/java/com/finance/etl/util/**"
      - "src/main/resources/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/build-sms-gmail-r2-job.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push SMS Gmail R2 Job Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests -Dmain.class=com.finance.etl.jobs.SmsGmailR2Job

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nvd11/sms-flink-batch-etl
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
